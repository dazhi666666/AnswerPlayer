<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subtitle Overlay</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
}
body {
  color: #000000;
  -webkit-app-region: drag;
}
#overlay {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px 36px;
  position: relative;
}
#lines {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: center;
  justify-content: center;
}
.line {
  width: 100%;
  text-align: center;
  line-height: 1.2;
  font-size: 36px;
  font-weight: 600;
  color: #000000;
  text-shadow:
    -2px -2px 0 #ffffff,
     2px -2px 0 #ffffff,
    -2px  2px 0 #ffffff,
     2px  2px 0 #ffffff,
     0 0 6px rgba(255,255,255,0.6);
  word-break: break-word;
  user-select: none;
}
.line.secondary {
  font-weight: 500;
  opacity: 0.92;
}
#controls {
  position: absolute;
  top: 10px;
  right: 10px;
  display: flex;
  gap: 8px;
  -webkit-app-region: no-drag;
}
.control {
  border: 0;
  border-radius: 999px;
  padding: 6px 10px;
  background: rgba(15, 23, 42, 0.42);
  color: #e2e8f0;
  font-size: 12px;
  cursor: pointer;
  backdrop-filter: blur(6px);
}
.control:hover {
  background: rgba(15, 23, 42, 0.6);
}
#hint {
  position: absolute;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  padding: 6px 10px;
  border-radius: 999px;
  background: rgba(15, 23, 42, 0.42);
  color: #e2e8f0;
  font-size: 12px;
  display: none;
  pointer-events: none;
}
</style>
</head>
<body>
<div id="overlay">
  <div id="controls">
    <button class="control" id="closeBtn" aria-label="Close">Close</button>
  </div>
  <div id="lines">
    <div class="line" id="line1"></div>
    <div class="line secondary" id="line2"></div>
  </div>
  <div id="hint"></div>
</div>

<script>
function ipcSend(channel, data) {
  window.postMessage({ t: 'ipc-send', c: channel, d: data }, '*');
}

const ipcOn = {};
let sentences = [];
let lines = 2;
let currentIndex = 0;
let hintTimer = null;

const line1El = document.getElementById('line1');
const line2El = document.getElementById('line2');
const hintEl = document.getElementById('hint');

function render() {
  line1El.textContent = sentences[currentIndex] || '';
  if (lines === 1) {
    line2El.style.display = 'none';
    line2El.textContent = '';
    return;
  }
  line2El.style.display = '';
  line2El.textContent = sentences[currentIndex + 1] || '';
}

function updateState(data) {
  sentences = Array.isArray(data.sentences) ? data.sentences : [];
  lines = data.lines === 1 ? 1 : 2;
  currentIndex = Number.isInteger(data.currentIndex) ? data.currentIndex : 0;
  render();
}

function showHint(text) {
  hintEl.textContent = text;
  hintEl.style.display = 'block';
  if (hintTimer) clearTimeout(hintTimer);
  hintTimer = setTimeout(() => {
    hintEl.style.display = 'none';
  }, 900);
}

function tryMove(delta) {
  if (!sentences.length) return;
  const nextIndex = currentIndex + delta;
  if (nextIndex < 0) {
    showHint('Already at the first line');
    return;
  }
  if (nextIndex >= sentences.length) {
    showHint('Already at the last line');
    return;
  }
  ipcSend(delta > 0 ? 'next-subtitle-line' : 'prev-subtitle-line');
}

window.addEventListener('message', (event) => {
  if (event.source !== window) return;
  const message = event.data;
  if (!message || message.t === 'ipc-send') return;
  const handler = ipcOn[message.t];
  if (handler) handler(message.d);
});

ipcOn['init-subtitle'] = (data) => updateState(data);
ipcOn['subtitle-state'] = (data) => updateState(data);

document.getElementById('closeBtn').addEventListener('click', () => {
  ipcSend('close-prompter');
});

document.addEventListener('keydown', (event) => {
  if (event.key === 'ArrowRight') {
    tryMove(1);
  } else if (event.key === 'ArrowLeft') {
    tryMove(-1);
  } else if (event.key === 'Escape') {
    ipcSend('close-prompter');
  }
});
</script>
</body>
</html>
